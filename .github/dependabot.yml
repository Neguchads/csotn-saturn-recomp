version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /engine
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      engine-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
